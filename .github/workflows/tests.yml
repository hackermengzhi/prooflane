name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --frozen --group dev --python '${{ matrix.python-version }}'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra browser --group dev --python '3.12'
      - run: uv run playwright install --with-deps chromium --only-shell
      - run: uv run python -m unittest discover -s tests -v
        env:
          PROOFLANE_TEST_BROWSER: '1'
      - run: uv run prooflane demo
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-evidence
          path: .prooflane/runs/
          include-hidden-files: true
