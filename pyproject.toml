[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prooflane"
version = "0.4.0"
description = "General testing and automation agents with traceable execution and acceptance checks"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
debug = ["frida>=17,<18"]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[project.scripts]
prooflane = "prooflane.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prooflane.demo" = ["*.html", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
